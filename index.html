<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #6c4ab6;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 25px;
            line-height: 1.6;
        }

        button {
            background-color: #6c4ab6;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #56389a;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Revendo Conceitos</h1>
    </header>

    <main>
        <h2>Olá, mundo!</h2>

        <p>
            Essa é uma página HTML simples criada para praticar
            desenvolvimento web.
        </p>

        <a href="login.html">
    <button>Clique aqui</button>
        </a>
    </main>

    <footer>
        <p>2026 - Revendo Conceitos</p>
    </footer>

</body>
</html>
